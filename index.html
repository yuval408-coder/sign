<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הסכם לחתימה</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #f2f1ec; --card: #fbfaf7; --ink: #2b1d14; --muted: #7a6f66; --line: #e4dfd4; --accent: #d9622b; --accent-strong: #b84d1b; --accent-soft: #fbe8dc; --ok: #15803d; --danger: #b91c1c; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: Rubik, Arial, sans-serif; font-size: 15px; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 24px 16px 60px; }
  .doc { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 32px; box-shadow: 0 1px 2px rgba(43,29,20,.05); overflow-x: auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px; margin-top: 16px; box-shadow: 0 1px 2px rgba(43,29,20,.04); }
  .card h2 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
  .hint { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; font-weight: 500; }
  input[type=text] { width: 100%; font: inherit; border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; background: #fff; }
  select { font: inherit; border: 1px solid var(--line); border-radius: 10px; padding: 11px 8px; background: #fff; color: var(--ink); flex: none; }
  input:focus { outline: 3px solid var(--accent-soft); border-color: var(--accent); }
  .sigpad { border: 1px dashed #cfc6b8; border-radius: 12px; background: #fff; width: 100%; height: 170px; touch-action: none; display: block; }
  .agree { display: flex; gap: 10px; align-items: flex-start; margin: 16px 0; font-size: 14px; line-height: 1.5; }
  .agree input { width: 20px; height: 20px; margin-top: 1px; accent-color: var(--accent); flex: none; }
  .btn { font: inherit; font-weight: 700; border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 10px; padding: 10px 16px; cursor: pointer; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; width: 100%; padding: 14px; font-size: 16px; border-radius: 12px; }
  .btn.primary:hover:not(:disabled) { background: var(--accent-strong); border-color: var(--accent-strong); }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn.small { padding: 5px 10px; font-size: 13px; font-weight: 500; }
  .err { color: var(--danger); font-size: 14px; min-height: 20px; margin-top: 8px; }
  .done { text-align: center; padding: 30px 20px; }
  .done .check { width: 64px; height: 64px; border-radius: 50%; background: #dcfce7; color: var(--ok); display: grid; place-items: center; font-size: 32px; margin: 0 auto 12px; }
  .state { text-align: center; color: var(--muted); padding: 60px 0; }
  .hidden { display: none !important; }
  @media (max-width: 600px) { .doc { padding: 18px 14px; border-radius: 10px; } }
</style>
</head>
<body>
<div class="wrap">
  <div id="loading" class="state">טוען את ההסכם…</div>
  <div id="doc" class="doc hidden"></div>

  <div id="signCard" class="card hidden">
    <h2>חתימה על ההסכם</h2>
    <p class="hint">לאחר החתימה יישלח עותק PDF חתום לכתובת <b id="toEmail" dir="ltr"></b></p>
    <div class="grid">
      <div><label for="name">שם מלא *</label><input type="text" id="name" autocomplete="name"></div>
      <div id="idWrap" class="hidden"><label for="clientId">ת.ז או ע.מ / ח.פ *</label>
        <div style="display:flex;gap:8px"><select id="clientIdType" aria-label="סוג המספר"><option value="id">ת.ז</option><option value="biz">ע.מ / ח.פ</option></select><input type="text" id="clientId" inputmode="numeric" dir="ltr"></div></div>
    </div>
    <div style="margin-top:14px">
      <div style="display:flex;justify-content:space-between;align-items:end"><label>חתימה * <span style="font-weight:400">(עם האצבע או העכבר)</span></label><button class="btn small" id="clear" type="button">ניקוי</button></div>
      <canvas id="pad" class="sigpad"></canvas>
    </div>
    <label class="agree"><input type="checkbox" id="agree"><span>קראתי את ההסכם, אני מסכים/ה לכל תנאיו, ומאשר/ת שחתימתי האלקטרונית מחייבת כחתימה בכתב יד.</span></label>
    <button class="btn primary" id="submit" disabled>חתימה ושליחה</button>
    <div class="err" id="err"></div>
  </div>

  <div id="doneCard" class="card done hidden">
    <div class="check">✓</div>
    <h2>ההסכם נחתם בהצלחה</h2>
    <p class="hint" id="doneText" style="font-size:15px"></p>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let agreementId = '';

// This copy of the signing page lives outside Google and talks to the Apps Script web app over JSON.
const API = 'https://script.google.com/macros/s/AKfycbxp8MIKO-3ikFEkBKK3VBWNjWrT6q9NKa_sWE5nVaBB32sriHNgVjfpzAInpYEPvJZZ/exec';

async function call(fn, ...args) {
  const res = fn === 'getAgreementForSigning'
    ? await fetch(API + '?api=agreement&id=' + encodeURIComponent(args[0]))
    // text/plain keeps this a simple request, so the browser skips the CORS preflight Apps Script can't answer
    : await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'sign', id: args[0], input: args[1] }) });
  if (!res.ok) throw new Error('שגיאת תקשורת, נסו שוב.');
  const data = await res.json();
  if (data && data.error && fn !== 'getAgreementForSigning') throw new Error(data.error);
  return data;
}

/* ---------- Signature pad ---------- */
const canvas = $('pad'), ctx = canvas.getContext('2d');
let drawing = false, dirty = false, last = null;
function fit(keep) {
  const r = canvas.getBoundingClientRect(), d = window.devicePixelRatio || 1;
  if (!r.width) return;
  // keep the strokes when the page only resizes (iPhone toolbars move while drawing)
  const old = keep && dirty ? canvas.toDataURL() : null;
  canvas.width = r.width * d; canvas.height = r.height * d;
  ctx.setTransform(d, 0, 0, d, 0, 0);
  ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1d1b19';
  if (old) {
    const im = new Image();
    im.onload = () => ctx.drawImage(im, 0, 0, r.width, r.height);
    im.src = old;
    return;
  }
  dirty = false; check();
}
const pos = e => { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
function start(p) { drawing = true; last = p; }
function move(p) {
  if (!drawing) return;
  ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p;
  if (!dirty) { dirty = true; check(); }
}
function end() { drawing = false; }
// in-app browsers (WhatsApp, Instagram) inside Google's iframe often deliver only touch events, so handle them directly
let usingTouch = false;
canvas.addEventListener('touchstart', e => { usingTouch = true; e.preventDefault(); start(pos(e.touches[0])); }, { passive: false });
canvas.addEventListener('touchmove', e => { e.preventDefault(); move(pos(e.touches[0])); }, { passive: false });
canvas.addEventListener('touchend', end);
canvas.addEventListener('touchcancel', end);
canvas.addEventListener('pointerdown', e => {
  if (e.pointerType === 'touch' || usingTouch) return;
  e.preventDefault(); start(pos(e));
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* not supported everywhere */ }
});
canvas.addEventListener('pointermove', e => { if (e.pointerType !== 'touch' && !usingTouch) move(pos(e)); });
['pointerup', 'pointercancel'].forEach(ev => canvas.addEventListener(ev, e => { if (e.pointerType !== 'touch') end(); }));
$('clear').onclick = () => fit(false);
let lastW = 0;
window.addEventListener('resize', () => {
  const w = canvas.getBoundingClientRect().width;
  if (drawing || Math.abs(w - lastW) < 2) return;
  lastW = w; fit(true);
});

/** Crop to the drawn strokes and cap the width so the PNG stays small. */
function sigPng() {
  const w = canvas.width, h = canvas.height, data = ctx.getImageData(0, 0, w, h).data;
  let x0 = w, y0 = h, x1 = 0, y1 = 0;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (data[(y * w + x) * 4 + 3]) {
    if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  const pad = 6, cw = x1 - x0 + pad * 2, ch = y1 - y0 + pad * 2, scale = Math.min(1, 400 / cw);
  const out = document.createElement('canvas'); out.width = cw * scale; out.height = ch * scale;
  out.getContext('2d').drawImage(canvas, x0 - pad, y0 - pad, cw, ch, 0, 0, out.width, out.height);
  return out.toDataURL('image/png');
}

/* ---------- Form ---------- */
let needsId = false;
const idOk = () => { const n = $('clientId').value.replace(/\D/g, '').length; return n >= 5 && n <= 12; };
function check() {
  $('submit').disabled = !($('name').value.trim() && dirty && $('agree').checked && (!needsId || idOk()));
}
$('name').addEventListener('input', check);
$('clientId').addEventListener('input', check);
$('agree').addEventListener('change', check);

$('submit').onclick = async () => {
  $('err').textContent = '';
  $('submit').disabled = true; $('submit').textContent = 'שולח…';
  try {
    const res = await call('signAgreement', agreementId, {
      name: $('name').value.trim(), signature: sigPng(), agent: navigator.userAgent,
      clientId: needsId ? $('clientId').value.trim() : '', clientIdType: $('clientIdType').value
    });
    await show(true);
    $('doneText').textContent = `עותק חתום נשלח ל-${res.email}. אפשר לסגור את החלון.`;
  } catch (e) {
    $('err').textContent = (e && e.message) || 'אירעה שגיאה, נסו שוב.';
    $('submit').textContent = 'חתימה ושליחה'; check();
  }
};

async function show(afterSign) {
  const a = await call('getAgreementForSigning', agreementId);
  $('loading').classList.add('hidden');
  if (a.error) { $('loading').textContent = a.error; $('loading').classList.remove('hidden'); return; }
  $('doc').innerHTML = a.html; $('doc').classList.remove('hidden');
  $('toEmail').textContent = a.clientEmail;
  if (a.status === 'signed') {
    $('signCard').classList.add('hidden'); $('doneCard').classList.remove('hidden');
    if (!afterSign) $('doneText').textContent = `ההסכם נחתם ב-${a.signedAt}. עותק נשלח למייל.`;
    return;
  }
  if (!$('name').value) $('name').value = a.clientName || '';
  needsId = !!a.needsId;
  $('idWrap').classList.toggle('hidden', !needsId);
  $('signCard').classList.remove('hidden');
  fit(false); lastW = canvas.getBoundingClientRect().width;
}

agreementId = new URLSearchParams(location.search).get('id') || '';
show(false).catch(e => { $('loading').textContent = 'שגיאה בטעינת ההסכם: ' + (e.message || e); });
</script>
</body>
</html>
